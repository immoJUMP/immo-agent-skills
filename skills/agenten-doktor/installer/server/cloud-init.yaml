#cloud-config
# Grundausstattung fuer einen Agenten-Server (Ubuntu 24.04 bei Hetzner).
# Der Agenten-Doktor uebergibt diese Datei beim Anlegen der VM als user_data.
# Danach kopiert er /opt/agenten per rsync und ruft `doktor installieren` auf.
#
# Grundsaetze:
# - Von aussen offen sind nur 80/443 (Caddy) und 41641/udp (Tailscale).
#   Port 22 laesst die Hetzner-Firewall nur von der IP des Einrichtenden zu,
#   nach dem Tailscale-Beitritt schliesst der Doktor ihn ganz.
# - Docker-Dienste binden auf 127.0.0.1, nur Caddy veroeffentlicht Ports.
# - Sicherheitsupdates laufen automatisch, Neustart nachts um 04:30.

timezone: Europe/Berlin
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades
  - restic
  - rsync
  - sqlite3
  - python3-yaml

write_files:
  - path: /etc/apt/apt.conf.d/52agenten-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/ssh/sshd_config.d/10-agenten.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
  - path: /etc/systemd/journald.conf.d/10-agenten.conf
    permissions: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "3" },
        "live-restore": true
      }
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h

runcmd:
  - [bash, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - [bash, -c, "curl -fsSL https://get.docker.com | sh"]
  - [bash, -c, "curl -fsSL https://tailscale.com/install.sh | sh"]
  - [bash, -c, "ufw default deny incoming && ufw default allow outgoing && ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw allow 443/udp && ufw allow 41641/udp && ufw allow in on tailscale0 && ufw --force enable"]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, fail2ban]
  - [mkdir, -p, /opt/agenten]
  - [bash, -c, "date -Is > /opt/agenten/.grundausstattung-fertig"]
