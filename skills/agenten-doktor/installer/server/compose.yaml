# Agenten-Server: feste Dienste. Die Agenten-Container erzeugt `doktor` aus dem
# Wissens-Repo in /opt/agenten/compose.agenten.yaml (ein Container je Agent).
#
# Start immer ueber `doktor` (setzt Projektname, Env-Dateien und beide Compose-Dateien).
#
# Netze:
#   web      Caddy und die Dienste, die Caddy veroeffentlicht
#   chatdb   nur MongoDB und Rocket.Chat (kein Agent erreicht die Datenbank)
#   agenten  Agenten, Rocket.Chat, Dateiablage (WebDAV), MietJUMP, Meridian
#
# Alle Image-Versionen sind fest. Aktualisieren nur ueber `doktor aktualisieren`.

name: agenten

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    <<: *log
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
      ACME_EMAIL: ${ACME_EMAIL:-}
      DASH_BENUTZER: ${DASH_BENUTZER:-team}
      DASH_PASS_HASH: ${DASH_PASS_HASH:?DASH_PASS_HASH fehlt}
    volumes:
      - ./installer/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./daten/dateien:/srv/dateien:ro
      - caddy_daten:/data
      - caddy_konfig:/config
    networks: [web]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    <<: *log
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    volumes:
      - ./daten/rocketchat/db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks: [chatdb]

  rocketchat:
    image: rocketchat/rocket.chat:8.7.1
    restart: unless-stopped
    <<: *log
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      ROOT_URL: https://chat.${DOMAIN}
      PORT: "3000"
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      DEPLOY_METHOD: docker
      ADMIN_USERNAME: ${RC_ADMIN_BENUTZER:-doktor}
      ADMIN_NAME: Doktor
      ADMIN_EMAIL: ${RC_ADMIN_EMAIL:-doktor@example.invalid}
      ADMIN_PASS: ${RC_ADMIN_PASS:?RC_ADMIN_PASS fehlt}
      CREATE_TOKENS_FOR_USERS: "true"
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      OVERWRITE_SETTING_Accounts_RegistrationForm: Disabled
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_Email_Auto_Opt_In: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_Enforce_Password_Fallback: "false"
      OVERWRITE_SETTING_API_Enable_Rate_Limiter: "false"
      OVERWRITE_SETTING_Message_AllowUnrecognizedSlashCommand: "true"
      OVERWRITE_SETTING_Language: de
      OVERWRITE_SETTING_Site_Name: Agenten-Team
      OVERWRITE_SETTING_Statistics_reporting: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks: [web, chatdb, agenten]

  dateien:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *log
    volumes:
      - ./installer/dateien/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./daten/dateien:/srv/dateien
    networks: [web, agenten]

  mietjump:
    image: mietjump:lokal
    build: ./mietjump-quelle
    restart: unless-stopped
    <<: *log
    environment:
      MIETJUMP_HOST: 0.0.0.0
      MIETJUMP_PORT: "8787"
      MIETJUMP_OEFFENTLICHE_URL: https://miet.${DOMAIN}
      MIETJUMP_VERMIETER: ${MIETJUMP_VERMIETER:-Ihr Vermieter}
    volumes:
      - ./daten/mietjump:/app/daten
    networks: [web, agenten]

  postfach:
    # Postfach-Wache: haelt den Google-Token, laesst nur Lesen, Entwuerfe und eigene Labels durch
    image: python:3.12-alpine
    profiles: [postfach]
    restart: unless-stopped
    <<: *log
    command: ["python3", "-u", "/app/postfach-wache.py"]
    env_file:
      - path: ./geheim/postfach.env
        required: false
    volumes:
      - ./installer/postfach:/app:ro
    networks: [agenten]

  meridian:
    image: meridian:lokal
    build: ./installer/meridian
    profiles: [meridian]
    restart: unless-stopped
    <<: *log
    env_file:
      - path: ./geheim/meridian.env
        required: false
    deploy:
      resources:
        limits: { memory: 4g }
    networks: [agenten]

networks:
  web: {}
  chatdb: {}
  agenten: {}

volumes:
  caddy_daten: {}
  caddy_konfig: {}
