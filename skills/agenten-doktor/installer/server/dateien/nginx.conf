# Dashboards und Artefakte der Agenten.
# 8080: nur lesen (Caddy veroeffentlicht das mit Passwort unter dash.<DOMAIN>)
# 8081: WebDAV schreiben, nur im Docker-Netz "agenten" erreichbar, nie veroeffentlicht
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  sendfile on;
  server_tokens off;
  access_log /dev/stdout;
  server {
    listen 8080;
    root /srv/dateien;
    autoindex on;
    autoindex_localtime on;
    location / { limit_except GET HEAD { deny all; } try_files $uri $uri/ =404; }
    location = /gesund { return 200 "ok\n"; }
  }
  server {
    listen 8081;
    root /srv/dateien;
    client_max_body_size 512m;
    client_body_temp_path /tmp/nginx-dav;
    dav_methods PUT DELETE MKCOL COPY MOVE;
    create_full_put_path on;
    dav_access user:rw group:r all:r;
    location / { limit_except GET HEAD PUT DELETE MKCOL COPY MOVE { deny all; } }
  }
}
