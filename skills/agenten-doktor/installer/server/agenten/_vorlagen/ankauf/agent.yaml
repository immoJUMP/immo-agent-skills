# Vorlage (kein laufender Agent, Ordner beginnt mit _). Kurt kopiert sie beim Einstellen nach
# agenten/<slug>/, passt Name, Suchgebiet und Fachverantwortliche/n an und legt den Vorschlag an.
slug: ankauf
name: Anke
rolle: Ankauf
emoji: "🔎"
fachverantwortlich:
  name: "{{EIGENTUEMER_NAME}}"
  github: "{{EIGENTUEMER_GITHUB}}"
  telegram_id: "{{EIGENTUEMER_TELEGRAM_ID}}"
rocketchat:
  raum: ankauf
  weitere_raeume: [team]
telegram: false
werkzeuge: [gmail, veroeffentlichen, vorschlag, fallbuch]
fach_skills: [deal-screener, bierdeckel-kalkulation, marktanalyse, akquise-agent]
routinen:
  - name: suchauftraege
    zeitplan: "0 8,18 * * *"
    auftrag: "Fuehre den Skill suchauftraege-auswerten aus. Melde in #ankauf nur Objekte, die den Ankaufskriterien entsprechen."
